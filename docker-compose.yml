version: '3.9'

services:
  db:
    image: postgres:15
    container_name: docket_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  backend:
    build: ./backend
    container_name: docket_backend
    command: >
      sh -c "python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: docket_frontend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    expose:
      - "3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      CHOKIDAR_USEPOLLING: true
      WATCHPACK_POLLING: true
      DANGEROUSLY_DISABLE_HOST_CHECK: true
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: docket_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

  locust:
    image: locustio/locust
    container_name: docket_locust
    volumes:
      - ./locust:/mnt/locust
    ports:
      - "8089:8089"
    command: -f /mnt/locust/locustfile.py
    depends_on:
      - nginx
      
volumes:
  postgres_data: